<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First 3D Webpage</title>
  <style>
    /* Remove default page borders and hide scrollbars */
    body {
      margin: 0;
      overflow: hidden;
      background: #0f172a;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Load Three.js directly from a public CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <script>
    // 1. Create the Stage (Scene)
    const scene = new THREE.Scene();

    // 2. Create the Eyes (Camera): Field of View, Aspect Ratio, Near, Far
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.z = 3;

    // 3. Create the Painter (Renderer)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 4. Create an Object: Shape + Material = Mesh
    const shape = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const material = new THREE.MeshNormalMaterial(); // Automatically paints faces with dynamic colors
    const cube = new THREE.Mesh(shape, material);
    scene.add(cube);

    // 5. The Render Loop: Spin the cube 60 times a second
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();

    // 6. Handle browser window resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
