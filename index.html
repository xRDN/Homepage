<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERDIAN | Interactive 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 2D INTRO OVERLAY */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050508;
      cursor: pointer;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-content {
      text-align: center;
      padding: 0 1.5rem;
    }

    .intro-title {
      font-size: clamp(2.8rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 20%, #6366f1 70%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }

    .intro-subtitle {
      font-size: clamp(0.9rem, 2vw, 1.15rem);
      color: #94a3b8;
      letter-spacing: 0.08em;
      font-weight: 400;
      max-width: 480px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }

    .intro-cta {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #64748b;
      animation: pulse-glow 2s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); color: #cbd5e1; }
    }

    /* 3D CANVAS & IN-GAME HUD */
    canvas#webgl {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      outline: none;
    }

    .hud {
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: #ffffff;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .hud.visible {
      opacity: 1;
    }

    .hud h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #f8fafc;
    }

    .hud p {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.2rem;
      letter-spacing: 0.04em;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- 2D Landing Screen -->
  <div id="intro-screen">
    <div class="intro-content">
      <h1 class="intro-title">ERDIAN</h1>
      <p class="intro-subtitle">Spatial Engine & Procedural 3D Environment</p>
      <div class="intro-cta">( Press anywhere to continue )</div>
    </div>
  </div>

  <!-- In-Engine Persistent HUD -->
  <div class="hud" id="hud">
    <h2>ERDIAN</h2>
    <p>Drag to rotate • Pinch/Scroll to zoom</p>
  </div>

  <!-- 3D Render Canvas -->
  <canvas id="webgl"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- TRANSITION CONTROLLER ---
    const introScreen = document.getElementById('intro-screen');
    const hud = document.getElementById('hud');
    let entered = false;

    function handleEnter() {
      if (entered) return;
      entered = true;
      introScreen.classList.add('hidden');
      hud.classList.add('visible');
    }

    // Pointerdown captures both mobile touch and desktop mouse clicks without delay
    introScreen.addEventListener('pointerdown', handleEnter, { passive: true });

    // --- 1. THREE.JS INITIALIZATION ---
    const canvas = document.querySelector('#webgl');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.035);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    // --- 2. LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0x60a5fa, 2.5);
    keyLight.position.set(5, 5, 4);
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(0xf43f5e, 4.0, 10);
    fillLight.position.set(-4, -2, -2);
    scene.add(fillLight);

    // --- 3. OBJECTS ---
    const artifactGeo = new THREE.TorusKnotGeometry(0.85, 0.28, 128, 32);
    const artifactMat = new THREE.MeshStandardMaterial({
      color: 0x1e1b4b,
      roughness: 0.15,
      metalness: 0.9
    });
    const artifact = new THREE.Mesh(artifactGeo, artifactMat);
    scene.add(artifact);

    // Particle Field
    const particleCount = 1200;
    const positions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 25;
      positions[i + 1] = (Math.random() - 0.5) * 25;
      positions[i + 2] = (Math.random() - 0.5) * 25;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMat = new THREE.PointsMaterial({
      color: 0x94a3b8,
      size: 0.04,
      transparent: true,
      opacity: 0.8
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // --- 4. CONTROLS ---
