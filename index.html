<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERDIAN | Multiplayer Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #020205;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }
    
    canvas#webgl {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      outline: none;
    }

    /* Spatial HTML UI Container */
    #ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Floating Chat Bubbles */
    .chat-bubble {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #f8fafc;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      backdrop-filter: blur(4px);
      transform: translate(-50%, -100%); /* Center above character */
      margin-top: -15px; /* Offset above head */
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .chat-bubble.visible { opacity: 1; }

    /* Player Nameplates */
    .nameplate {
      position: absolute;
      color: #94a3b8;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: translate(-50%, -100%);
      margin-top: 5px;
    }

    /* Game HUD */
    #chat-interface {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 20;
    }
    
    input[type="text"] {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.75rem 1rem;
      border-radius: 99px;
      width: 300px;
      outline: none;
      backdrop-filter: blur(10px);
    }
    input[type="text"]:focus { border-color: #6366f1; }
    
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 0 1.5rem;
      border-radius: 99px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- The 3D Canvas -->
  <canvas id="webgl"></canvas>

  <!-- The 2D Spatial UI Layer -->
  <div id="ui-layer"></div>

  <!-- Chat Input -->
  <div id="chat-interface">
    <input type="text" id="chat-input" placeholder="Press Enter to chat..." autocomplete="off">
    <button id="chat-send">Send</button>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // --- 1. CORE ENGINE ---
    const canvas = document.querySelector('#webgl');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020205, 0.04);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    // Environment
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    const dirLight = new THREE.DirectionalLight(0x6366f1, 2);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(50, 50, 0x1e1b4b, 0x0f172a);
    scene.add(grid);

    // --- 2. PLAYER & MULTIPLAYER ARCHITECTURE ---
    const uiLayer = document.getElementById('ui-layer');
    const players = new Map(); // Stores all active clients

    // Reusable materials for optimization
    const matHigh = new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.2 });
    const matLow = new THREE.MeshBasicMaterial({ color: 0x4f46e5 });

    class Player {
      constructor(id, isLocal = false) {
        this.id = id;
        this.isLocal = isLocal;
        
        // Target positioning for network interpolation (smoothing lag)
        this.targetPos = new THREE.Vector3();
        this.targetRot = 0;

        // Create LOD (Level of Detail) Mesh
        this.mesh = new THREE.LOD();
        
        // High-res geometry (Close up)
        const geoHigh = new THREE.CapsuleGeometry(0.5, 1, 16, 16);
        const meshHigh = new THREE.Mesh(geoHigh, matHigh);
        meshHigh.position.y = 1; // Stand on ground
        
        // Add a "visor" to show forward direction
        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.4), new THREE.MeshBasicMaterial({color: 0x000000}));
        visor.position.set(0, 0.4, 0.4);
        meshHigh.add(visor);

        // Low-res geometry (Far away)
        const geoLow = new THREE.BoxGeometry(1, 2, 1);
        const meshLow = new THREE.Mesh(geoLow, matLow);
        meshLow.position.y = 1;

        // Add levels to LOD (Distance thresholds)
        this.mesh.addLevel(meshHigh, 0);   // Under 15m: Render Capsule
        this.mesh.addLevel(meshLow, 15);   // Over 15m: Render Box
        
        scene.add(this.mesh);

        // Create Spatial UI Elements
        this.chatElement = document.createElement('div');
        this.chatElement.className = 'chat-bubble';
        
        this.nameElement = document.createElement('div');
        this.nameElement.className = 'nameplate';
        this.nameElement.innerText = isLocal ? "You" : `Visitor_${id.substring(0,4)}`;
        
        uiLayer.appendChild(this.chatElement);
        uiLayer.appendChild(this.nameElement);
        
        this.chatTimeout = null;
      }

      say(message) {
        this.chatElement.innerText = message;
        this.chatElement.classList.add('visible');
        clearTimeout(this.chatTimeout);
        this.chatTimeout = setTimeout(() => {
          this.chatElement.classList.remove('visible');
        }, 4000);
      }

      updateSpatialUI(camera) {
        // Project 3D head position to 2D screen coordinates
        const headPos = this.mesh.position.clone();
        headPos.y += 2.2; // Top of the capsule
        
        headPos.project(camera);

        // Convert projection to CSS pixels
        const x = (headPos.x *  .5 + .5) * window.innerWidth;
        const y = (headPos.y * -.5 + .5) * window.innerHeight;

        // Hide UI if player is behind camera
        if (headPos.z > 1) {
          this.chatElement.style.display = 'none';
          this.nameElement.style.display = 'none';
          return;
        }

        this.chatElement.style.display = 'block';
        this.nameElement.style.display = 'block';
        this.chatElement.style.left = `${x}px`;
        this.chatElement.style.top = `${y}px`;
        this.nameElement.style.left = `${x}px`;
        this.nameElement.style.top = `${y}px`;
      }
    }

    // Initialize Local Player
    const localId = "local_" + Math.floor(Math.random() * 1000);
    const localPlayer = new Player(localId, true);
    players.set(localId, localPlayer);

    // --- 3. INPUT & THIRD PERSON CAMERA ---
    const keys = { w: false, a: false, s: false, d: false };
    
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === document.getElementById('chat-input')) return;
      if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
    });

    const moveSpeed = 0.1;
    const rotSpeed = 0.05;

    function handleLocalMovement() {
      // 1. Update Rotation
      if (keys.a) localPlayer.mesh.rotation.y += rotSpeed;
      if (keys.d) localPlayer.mesh.rotation.y -= rotSpeed;

      // 2. Update Position (forward/backward along local Z axis)
      const direction = new THREE.Vector3();
      localPlayer.mesh.getWorldDirection(direction);

      if (keys.w) {
        localPlayer.mesh.position.addScaledVector(direction, moveSpeed);
      }
      if (keys.s) {
        localPlayer.mesh.position.addScaledVector(direction, -moveSpeed);
      }

      // 3. Third-Person Camera Follow (Damped)
      // Calculate ideal camera position (behind and above player)
      const idealOffset = new THREE.Vector3(0, 3, -6);
      idealOffset.applyQuaternion(localPlayer.mesh.quaternion);
      idealOffset.add(localPlayer.mesh.position);

      // Lerp camera to ideal position for smooth follow
      camera.position.lerp(idealOffset, 0.1);
      
      // Look at slightly above player's head
      const lookAtPos = localPlayer.mesh.position.clone();
      lookAtPos.y += 1.5;
      camera.lookAt(lookAtPos);
    }

    // --- 4. CHAT SYSTEM ---
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');

    function sendChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      
      localPlayer.say(text);
      
      // IN A REAL APP: socket.send({ type: 'chat', msg: text })
      
      chatInput.value = '';
      chatInput.blur();
    }

    chatSend.addEventListener('click', sendChat);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendChat();
    });

    // --- 5. NETWORK SIMULATOR (Faking WebSockets) ---
    // This simulates data arriving from other players over the internet
    function simulateIncomingNetworkData() {
      // Spawn a fake visitor
      const remoteId = "remote_992";
      if (!players.has(remoteId)) {
        const remotePlayer = new Player(remoteId);
        remotePlayer.mesh.position.set(5, 0, 5);
        remotePlayer.targetPos.set(5, 0, 5);
        players.set(remoteId, remotePlayer);
        
        setTimeout(() => remotePlayer.say("Whoa, where am I?"), 2000);
        setTimeout(() => remotePlayer.targetPos.set(2, 0, -2), 4000);
        setTimeout(() => remotePlayer.say("Cool rendering engine."), 6000);
      }
    }
    
    setTimeout(simulateIncomingNetworkData, 1000);

    // --- 6. MAIN RENDER LOOP ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);

      // Process movement for local player
      handleLocalMovement();

      // Process Networked Players
      players.forEach((player) => {
        // Update LODs based on distance to camera
        player.mesh.update(camera);
        
        // Project 3D position to HTML UI
        player.updateSpatialUI(camera);

        // Network Smoothing: Glide remote players to their target coordinates
        if (!player.isLocal) {
          player.mesh.position.lerp(player.targetPos, 0.05);
          // (In a real app, you would also lerp player.targetRot)
          
          // Make remote players look at the local player (just for this demo)
          player.mesh.lookAt(localPlayer.mesh.position.x, player.mesh.position.y, localPlayer.mesh.position.z);
        }
      });

      // IN A REAL APP: socket.send({ x: localPlayer.x, z: localPlayer.z })

      renderer.render(scene, camera);
    }
    
    animate();
  </script>
</body>
</html>
