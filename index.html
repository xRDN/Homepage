<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERDIAN | Networked Zone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #020205;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }
    
    /* 1. 2D CINEMATIC INTRO */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #090918 0%, #020205 100%);
      cursor: pointer;
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s;
    }
    #intro-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    
    .intro-title {
      font-size: clamp(3.2rem, 9vw, 7.5rem);
      font-weight: 900;
      letter-spacing: 0.22em;
      background: linear-gradient(135deg, #ffffff 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }
    .intro-cta {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      color: #cbd5e1;
      animation: float-pulse 2.5s infinite ease-in-out;
    }
    @keyframes float-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* 2. 3D & SPATIAL UI */
    canvas#webgl {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
    #ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .chat-bubble {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #f8fafc;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      backdrop-filter: blur(4px);
      transform: translate(-50%, -100%);
      margin-top: -15px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .chat-bubble.visible { opacity: 1; }
    .nameplate {
      position: absolute;
      color: #94a3b8;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: translate(-50%, -100%);
      margin-top: 5px;
    }

    /* 3. IN-GAME HUD */
    #chat-interface {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    #chat-interface.unlocked {
      opacity: 1;
      pointer-events: auto;
    }
    input[type="text"] {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.75rem 1rem;
      border-radius: 99px;
      width: 300px;
      outline: none;
      backdrop-filter: blur(10px);
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 0 1.5rem;
      border-radius: 99px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- Landing Screen -->
  <div id="intro-screen">
    <h1 class="intro-title">ERDIAN</h1>
    <div class="intro-cta">PRESS ANYWHERE TO DEPLOY</div>
  </div>

  <canvas id="webgl"></canvas>
  <div id="ui-layer"></div>

  <!-- Operational HUD -->
  <div id="chat-interface">
    <input type="text" id="chat-input" placeholder="Press Enter to chat..." autocomplete="off">
    <button id="chat-send">Send</button>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // --- STATE MACHINE ---
    let engineState = 'INTRO'; // 'INTRO' -> 'WARPING' -> 'INTERACTIVE'

    // --- AUDIO SYSTEM ---
    function triggerAtmosphereSwell() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 1.2);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 5.0);
        masterGain.connect(audioCtx.destination);
        const subOsc = audioCtx.createOscillator();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
        subOsc.connect(masterGain);
        subOsc.start();
        subOsc.stop(audioCtx.currentTime + 5.2);
      } catch (e) {}
    }

    // --- ENGINE INIT ---
    const canvas = document.querySelector('#webgl');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020205, 0.035);

    // Initial Camera High in the Stratosphere
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 40, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xa855f7, 2);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(100, 100, 0x1e1b4b, 0x0f172a);
    scene.add(grid);

    // --- ENTITY SYSTEM ---
    const uiLayer = document.getElementById('ui-layer');
    const players = new Map();

    const matHigh = new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.2 });
    const matLow = new THREE.MeshBasicMaterial({ color: 0x4f46e5 });

    class Player {
      constructor(id, isLocal = false) {
        this.id = id;
        this.isLocal = isLocal;
        this.targetPos = new THREE.Vector3();
        
        this.mesh = new THREE.LOD();
        const geoHigh = new THREE.CapsuleGeometry(0.5, 1, 16, 16);
        const meshHigh = new THREE.Mesh(geoHigh, matHigh);
        meshHigh.position.y = 1;
        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.4), new THREE.MeshBasicMaterial({color: 0x000000}));
        visor.position.set(0, 0.4, 0.4);
        meshHigh.add(visor);

        const geoLow = new THREE.BoxGeometry(1, 2, 1);
        const meshLow = new THREE.Mesh(geoLow, matLow);
        meshLow.position.y = 1;

        this.mesh.addLevel(meshHigh, 0);
        this.mesh.addLevel(meshLow, 20);
        scene.add(this.mesh);

        this.chatElement = document.createElement('div');
        this.chatElement.className = 'chat-bubble';
        this.nameElement = document.createElement('div');
        this.nameElement.className = 'nameplate';
        this.nameElement.innerText = isLocal ? "You" : `Visitor_${id.substring(0,4)}`;
        
        uiLayer.appendChild(this.chatElement);
        uiLayer.appendChild(this.nameElement);
        this.chatTimeout = null;
      }

      say(message) {
        this.chatElement.innerText = message;
        this.chatElement.classList.add('visible');
        clearTimeout(this.chatTimeout);
        this.chatTimeout = setTimeout(() => this.chatElement.classList.remove('visible'), 4000);
      }

      updateSpatialUI(camera) {
        const headPos = this.mesh.position.clone();
        headPos.y += 2.2;
        headPos.project(camera);
        const x = (headPos.x * .5 + .5) * window.innerWidth;
        const y = (headPos.y * -.5 + .5) * window.innerHeight;

        if (headPos.z > 1) {
          this.chatElement.style.display = 'none';
          this.nameElement.style.display = 'none';
          return;
        }
        this.chatElement.style.display = 'block';
        this.nameElement.style.display = 'block';
        this.chatElement.style.left = `${x}px`;
        this.chatElement.style.top = `${y}px`;
        this.nameElement.style.left = `${x}px`;
        this.nameElement.style.top = `${y}px`;
      }
    }

    const localPlayer = new Player("local_" + Math.floor(Math.random() * 1000), true);
    players.set(localPlayer.id, localPlayer);

    // --- KINEMATICS & INPUT ---
    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === document.getElementById('chat-input') || engineState !== 'INTERACTIVE') return;
      if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
    });

    // --- TRANSITION SEQUENCE ---
    const introScreen = document.getElementById('intro-screen');
    const chatInterface = document.getElementById('chat-interface');

    introScreen.addEventListener('pointerdown', () => {
      if (engineState !== 'INTRO') return;
      engineState = 'WARPING';
      introScreen.classList.add('hidden');
      triggerAtmosphereSwell();
    });

    // --- SIMULATED MULTIPLAYER DATA ---
    function spawnNetworkEvent() {
      const remoteId = "remote_" + Math.floor(Math.random() * 9000);
      const remotePlayer = new Player(remoteId);
      remotePlayer.mesh.position.set(10, 0, 10);
      remotePlayer.targetPos.set(10, 0, 10);
      players.set(remoteId, remotePlayer);
      
      setTimeout(() => remotePlayer.say("Connection established."), 1000);
      setTimeout(() => remotePlayer.targetPos.set(3, 0, -3), 2000);
    }

    // --- UI EVENTS ---
    const chatInput = document.getElementById('chat-input');
    document.getElementById('chat-send').addEventListener('click', () => {
      if (chatInput.value.trim()) { localPlayer.say(chatInput.value.trim()); chatInput.value = ''; }
    });
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('chat-send').click();
    });

    // --- RENDER PIPELINE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);

      // STATE EVALUATION
      if (engineState === 'WARPING') {
        const idealOffset = new THREE.Vector3(0, 4, -8).applyQuaternion(localPlayer.mesh.quaternion).add(localPlayer.mesh.position);
        camera.position.lerp(idealOffset, 0.035); // Smooth descent
        
        const lookTarget = localPlayer.mesh.position.clone();
        lookTarget.y += 1.5;
        camera.lookAt(lookTarget);

        if (camera.position.distanceTo(idealOffset) < 0.5) {
          engineState = 'INTERACTIVE';
          chatInterface.classList.add('unlocked');
          setTimeout(spawnNetworkEvent, 1500); // Trigger network sequence after landing
        }
      } 
      else if (engineState === 'INTERACTIVE') {
        // Local WASD Physics
        if (keys.a) localPlayer.mesh.rotation.y += 0.05;
        if (keys.d) localPlayer.mesh.rotation.y -= 0.05;

        const direction = new THREE.Vector3();
        localPlayer.mesh.getWorldDirection(direction);
        if (keys.w) localPlayer.mesh.position.addScaledVector(direction, 0.15);
        if (keys.s) localPlayer.mesh.position.addScaledVector(direction, -0.15);

        // 3rd Person Follow
        const idealOffset = new THREE.Vector3(0, 4, -8).applyQuaternion(localPlayer.mesh.quaternion).add(localPlayer.mesh.position);
        camera.position.lerp(idealOffset, 0.1);
        const lookTarget = localPlayer.mesh.position.clone();
        lookTarget.y += 1.5;
        camera.lookAt(lookTarget);
      }

      // GLOBAL ENTITY UPDATES
      players.forEach((player) => {
        player.mesh.update(camera); // Update LOD
        player.updateSpatialUI(camera); // Sync HTML text to 3D head

        if (!player.isLocal) {
          player.mesh.position.lerp(player.targetPos, 0.05); // Smooth lag from network
          player.mesh.lookAt(localPlayer.mesh.position.x, player.mesh.position.y, localPlayer.mesh.position.z);
        }
      });

      renderer.render(scene, camera);
    }
    
    animate();
  </script>
</body>
</html>
