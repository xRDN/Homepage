<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Erdian · little island</title>
<meta name="description" content="A tiny walkable island with my links.">
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="webgl" aria-label="A small 3D island you can walk around"></canvas>
<div id="labels"></div>

<section id="intro" class="screen">
  <div class="card">
    <p class="eyebrow">welcome to</p>
    <h1>Erdian's<br>little island</h1>
    <p class="sub">A tiny place with my links, a friend or two, and room to wander.</p>
    <button id="go" class="btn">Come on in</button>
  </div>
</section>

<section id="pick" class="screen hidden">
  <div class="card low">
    <h2>Pick a buddy</h2>
    <div class="picks">
      <button class="pick on" data-t="slime"><b>🫧</b>Blobby</button>
      <button class="pick" data-t="bot"><b>🐰</b>Bunbot</button>
    </div>
    <button id="start" class="btn">Let's go</button>
  </div>
</section>

<div id="hud" class="hidden">
  <nav id="links" aria-label="My links"></nav>
  <button id="prompt" class="btn hidden"></button>
  <form id="chat" autocomplete="off">
    <input id="msg" type="text" maxlength="80" placeholder="Say something… (Enter)" aria-label="Chat message">
    <button class="btn" type="submit">Send</button>
  </form>
  <p id="hint">WASD / arrows move · Space jumps · drag to look · E opens a sign</p>
  <div id="joy"><i></i></div>
  <button id="jump" class="btn" aria-label="Jump">⤒</button>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
